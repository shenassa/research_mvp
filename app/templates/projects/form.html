<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <title>
        {% if project %}
            ویرایش کلان‌پروژه
        {% else %}
            ایجاد کلان‌پروژه
        {% endif %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a
            href="/dashboard"
            class="navbar-brand"
        >
            سامانه مدیریت کلان‌پروژه‌ها
        </a>

        <a
            href="/projects"
            class="btn btn-light btn-sm"
        >
            بازگشت
        </a>

    </div>

</nav>


<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <h3 class="mb-4">

                {% if project %}
                    ویرایش کلان‌پروژه
                {% else %}
                    ایجاد کلان‌پروژه جدید
                {% endif %}

            </h3>


            <form
                method="post"
                action="{% if project %}/projects/{{ project.id }}/edit{% else %}/projects/new{% endif %}"
            >

                <div class="mb-3">

                    <label class="form-label">
                        عنوان کلان‌پروژه *
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        required
                        value="{{ project.title if project else '' }}"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        شرح
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                    >{{ project.description if project else '' }}</textarea>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        اهداف
                    </label>

                    <textarea
                        name="objectives"
                        class="form-control"
                        rows="4"
                    >{{ project.objectives if project else '' }}</textarea>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        خروجی‌ها / دستاوردهای مورد انتظار
                    </label>

                    <textarea
                        name="outputs"
                        class="form-control"
                        rows="4"
                    >{{ project.outputs if project else '' }}</textarea>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            مسئول کلان‌پروژه
                        </label>

                        <select
                            name="manager_id"
                            class="form-select"
                        >

                            <option value="">
                                -- انتخاب مسئول --
                            </option>

                            {% for user_item in users %}

                            <option
                                value="{{ user_item.id }}"
                                {% if project and project.manager_id == user_item.id %}
                                    selected
                                {% endif %}
                            >
                                {{ user_item.full_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            معاونت / واحد متولی
                        </label>

                        <select
                            name="owner_department_id"
                            class="form-select"
                        >

                            <option value="">
                                -- انتخاب واحد --
                            </option>

                            {% for department in departments %}

                            <option
                                value="{{ department.id }}"
                                {% if project and project.owner_department_id == department.id %}
                                    selected
                                {% endif %}
                            >
                                {{ department.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        ذی‌نفع اصلی
                    </label>

                    <input
                        type="text"
                        name="beneficiary"
                        class="form-control"
                        value="{{ project.beneficiary if project else '' }}"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        واحد بهره‌بردار / ذی‌نفع
                    </label>

                    <select
                        name="beneficiary_department_id"
                        class="form-select"
                    >

                        <option value="">
                            -- انتخاب واحد --
                        </option>

                        {% for department in departments %}

                        <option
                            value="{{ department.id }}"
                            {% if project and project.beneficiary_department_id == department.id %}
                                selected
                            {% endif %}
                        >
                            {{ department.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            وضعیت
                        </label>

                        <select
                            name="status"
                            class="form-select"
                        >

                            <option
                                value="NOT_STARTED"
                                {% if not project or project.status == "NOT_STARTED" %}
                                    selected
                                {% endif %}
                            >
                                شروع نشده
                            </option>

                            <option
                                value="IN_PROGRESS"
                                {% if project and project.status == "IN_PROGRESS" %}
                                    selected
                                {% endif %}
                            >
                                در حال اجرا
                            </option>

                            <option
                                value="COMPLETED"
                                {% if project and project.status == "COMPLETED" %}
                                    selected
                                {% endif %}
                            >
                                تکمیل شده
                            </option>

                            <option
                                value="SUSPENDED"
                                {% if project and project.status == "SUSPENDED" %}
                                    selected
                                {% endif %}
                            >
                                متوقف شده
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            درصد پیشرفت
                        </label>

                        <input
                            type="number"
                            name="progress_percent"
                            class="form-control"
                            min="0"
                            max="100"
                            step="0.1"
                            value="{{ project.progress_percent if project else 0 }}"
                        >

                    </div>

                </div>


                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        ذخیره
                    </button>

                    <a
                        href="/projects"
                        class="btn btn-secondary"
                    >
                        انصراف
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
