<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>افزودن مشارکت‌کننده</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3>افزودن مشارکت‌کننده</h3>

            <p class="text-muted mb-0">
                کلان‌پروژه:
                <strong>{{ project.title }}</strong>
            </p>
        </div>

        <a
            href="/projects/{{ project.id }}"
            class="btn btn-secondary"
        >
            بازگشت
        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <form
                method="post"
                action="/projects/{{ project.id }}/participants/new"
            >

                <!-- نام -->
                <div class="mb-3">

                    <label class="form-label">
                        نام و نام خانوادگی
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        required
                    >

                </div>


                <!-- سازمان -->
                <div class="mb-3">

                    <label class="form-label">
                        سازمان / واحد
                    </label>

                    <input
                        type="text"
                        name="organization"
                        class="form-control"
                        placeholder="مثلاً معاونت پژوهش"
                    >

                </div>


                <!-- نقش -->
                <div class="mb-3">

                    <label class="form-label">
                        نقش در پروژه
                    </label>

                    <input
                        type="text"
                        name="role"
                        class="form-control"
                        placeholder="مثلاً عضو تیم، کارشناس، مشاور"
                    >

                </div>


                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        ذخیره مشارکت‌کننده
                    </button>

                    <a
                        href="/projects/{{ project.id }}"
                        class="btn btn-secondary"
                    >
                        انصراف
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
