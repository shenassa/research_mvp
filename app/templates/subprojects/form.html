<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ایجاد زیرپروژه</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3>
    {% if subproject %}
        ویرایش زیرپروژه
    {% else %}
        ایجاد زیرپروژه
    {% endif %}
</h3>
            <p class="text-muted mb-0">
                کلان‌پروژه:
                <strong>{{ project.title }}</strong>
            </p>
        </div>

        <a
            href="/projects/{{ project.id }}"
            class="btn btn-secondary"
        >
            بازگشت
        </a>
    </div>


    <div class="card shadow-sm">
        <div class="card-body">

            <form
    method="post"
    action="{% if subproject %}/subprojects/{{ subproject.id }}/edit{% else %}/projects/{{ project.id }}/subprojects/new{% endif %}"
>

                <!-- عنوان -->
                <div class="mb-3">
                    <label class="form-label">
                        عنوان زیرپروژه
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        value="{{ subproject.title if subproject else '' }}"
                        required
                    >
                </div>


                <!-- شرح -->
                <div class="mb-3">
                    <label class="form-label">
                        شرح زیرپروژه
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                    >{{ subproject.description if subproject else '' }}</textarea>
                </div>


                <!-- مسئول -->
                <div class="mb-3">
                    <label class="form-label">
                        مسئول زیرپروژه
                    </label>

                    <select
                        name="manager_id"
                        class="form-select"
                    >
                        <option value="">
                            -- انتخاب مسئول --
                        </option>

                        {% for user_item in users %}

                        <option
                            value="{{ user_item.id }}"
                            {% if subproject and subproject.manager_id == user_item.id %}
                                selected
                            {% endif %}
                        >
                            {{ user_item.full_name }}
                        </option>

                        {% endfor %}

                    </select>
                </div>


                <div class="row">

                    <!-- وضعیت -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            وضعیت
                        </label>

                        <select
                            name="status"
                            class="form-select"
                        >
<option
    value="NOT_STARTED"
    {% if subproject and subproject.status == "NOT_STARTED" %}
        selected
    {% endif %}
>
    شروع نشده
</option>

                            <option
    value="IN_PROGRESS"
    {% if subproject and subproject.status == "IN_PROGRESS" %}
        selected
    {% endif %}
>
    در حال اجرا
</option>

                            <option
    value="COMPLETED"
    {% if subproject and subproject.status == "COMPLETED" %}
        selected
    {% endif %}
>
    تکمیل شده
</option>

                            <option
    value="SUSPENDED"
    {% if subproject and subproject.status == "SUSPENDED" %}
        selected
    {% endif %}
>
    متوقف شده
</option>
                        </select>

                    </div>


                    <!-- پیشرفت -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            درصد پیشرفت
                        </label>

                        <input
                            type="number"
                            name="progress_percent"
                            class="form-control"
                            min="0"
                            max="100"
                            step="1"
                            value="{{ subproject.progress_percent if subproject else 0 }}"
                        >

                    </div>

                </div>


                <div class="row">

                    <!-- تاریخ شروع -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            تاریخ شروع
                        </label>

                        <input
    type="date"
    name="start_date"
    class="form-control"
    value="{{ subproject.start_date.isoformat() if subproject and subproject.start_date else '' }}"
>

                    </div>


                    <!-- تاریخ پایان -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            تاریخ پایان
                        </label>

                        <input
    type="date"
    name="end_date"
    class="form-control"
    value="{{ subproject.end_date.isoformat() if subproject and subproject.end_date else '' }}"
>

                    </div>

                </div>


                <div class="mt-4">

                    <button
    type="submit"
    class="btn btn-primary"
>
    {% if subproject %}
        ذخیره تغییرات
    {% else %}
        ذخیره زیرپروژه
    {% endif %}
</button>

                    <a
                        href="/projects/{{ project.id }}"
                        class="btn btn-secondary"
                    >
                        انصراف
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
